--bg:#0c0f13;--card:#171a20;--line:#262a32;--line-soft:#1c2028;--line-d:#343a44;--hero-line:transparent;--tx:#f1f1f4;--tx2:#9a9aa4;--tx3:#63636d;--shade:#14171d;
--green-l:#1e3a10;--green-t:#8ee84f;--blue-l:#0d2b3a;--blue-t:#6cd0ff;
--gold-l:#3a2f00;--gold-t:#ffd952;--red-l:#3a1618;--red-t:#ff8a8a;--purple-l:#2e1a3a;--purple-t:#dda6ff;--indigo-l:#241f47;--indigo-t:#b3a8ff;
--nav-tr:rgba(12,15,19,.82);--shadow-sm:0 1px 2px rgba(0,0,0,.2);--shadow-md:0 10px 28px -10px rgba(0,0,0,.5);--shadow-card:0 1px 2px rgba(0,0,0,.2),0 6px 20px -8px rgba(0,0,0,.4);}
body{font-family:'Plex',-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif;
background:var(--bg);color:var(--tx);line-height:1.65;padding:0 0 104px;max-width:640px;margin:0 auto;font-size:15px;-webkit-font-smoothing:antialiased}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.35}
h3{font-size:15.5px;font-weight:800;letter-spacing:-.005em}
.en{direction:ltr;text-align:left}
.wrap{padding:16px}
/* header */
.hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;gap:10px;flex-wrap:wrap}
.hd .lg{font-size:18px;font-weight:800;letter-spacing:-.015em}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13.5px;background:var(--shade);
padding:6px 11px;border-radius:20px}
.chip.st{color:var(--gold-t)}.chip.xp{color:var(--blue-t)}.chip.dw{color:var(--gold-t)}
/* nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav-tr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
display:flex;max-width:640px;margin:0 auto;z-index:50}
.nv{flex:1;padding:15px 2px 13px;border:0;background:transparent;cursor:pointer;font-family:inherit;
color:var(--tx3);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s}
.nv i{font-style:normal;font-size:21px;line-height:1}
.nv.on{color:var(--green)}
/* cards */
.c{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.c.flat{border:0;background:var(--shade);box-shadow:none}
h2{font-size:17px;font-weight:800;margin-bottom:3px}
.sub{color:var(--tx2);font-size:13px}
/* buttons */
.b{padding:14px 22px;border:0;border-radius:14px;cursor:pointer;box-shadow:var(--shadow-sm);
font-family:inherit;font-size:14.5px;font-weight:800;transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease;display:inline-block;text-align:center}
.b:active{transform:scale(.97);box-shadow:none}
/* pressed states for elements that lacked one */
.backbtn:active{opacity:.6}
.fav:active{transform:scale(.82)}
.more-row:active{background:var(--shade)}
.nv:active{transform:scale(.92)}
.seg button:active{transform:scale(.95)}
.wh:active{opacity:.7}
/* hover states — mouse-only, guarded so touch taps never get a stuck hover */
@media(hover:hover) and (pointer:fine){
  .b:not(:disabled):hover{filter:brightness(1.06);box-shadow:var(--shadow-md)}
  .backbtn:hover{color:var(--tx)}
  .fav:hover{transform:scale(1.15)}
  .quick:hover{border-color:var(--green);box-shadow:var(--shadow-md)}
  .modecard:hover{border-color:var(--green);box-shadow:var(--shadow-md)}
  .more-row:hover{background:var(--shade)}
  .nv:hover{color:var(--tx)}
  .seg button:hover{background:var(--shade)}
  .node:not(.lock):hover{border-color:var(--green);box-shadow:var(--shadow-md)}
  .wh:hover{background:var(--shade)}
  .wr .go:hover{filter:brightness(1.08)}
}
.b.g{background:var(--green);color:#fff}
.b.bl{background:var(--green);color:#fff}
.b.y{background:var(--gold);color:#4a3800}
.b.r{background:var(--red);color:#fff}
.b.gh{background:transparent;border:1px solid var(--line);color:var(--tx2);box-shadow:none}
.b.full{display:block;width:100%}
.b:disabled{background:var(--line);color:var(--tx3);cursor:default;box-shadow:none}
/* path */
.node{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line-soft);
border-radius:18px;margin-bottom:9px;cursor:pointer;background:var(--card);box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s}
.node:active{transform:scale(.985)}
.node.lock{opacity:.55;box-shadow:none}
.node.now{border-color:var(--green);background:var(--green-l)}
.node.dn{border-color:var(--green);}
.orb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-weight:800;font-size:15px;flex-shrink:0}
.node-ring{position:relative;width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.node-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.node-ring span{position:relative;font-size:10px;font-weight:800;color:var(--green-t)}
.o-verbs{background:var(--purple);color:#fff;box-shadow:0 4px 10px -3px #ce82ff99}
.o-adj{background:var(--green);color:#fff;box-shadow:0 4px 10px -3px #58cc0299}
.o-nouns{background:var(--gold);color:#4a3800;box-shadow:0 4px 10px -3px #ffc80099}
.o-general{background:var(--blue);color:#fff;box-shadow:0 4px 10px -3px #1cb0f699}
.o-phrases{background:#e0567e;color:#fff;box-shadow:0 4px 10px -3px #e0567e99}
.orb.lk{background:var(--shade);color:var(--tx3);box-shadow:none}
.node .tt{font-weight:800;font-size:14.5px}
.node .ds{font-size:11.5px;color:var(--tx2)}
.mini{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px;max-width:130px}
.mini>i{display:block;height:100%;background:var(--green);transition:width .5s}
/* progress ring */
.ring{display:flex;align-items:center;gap:16px}
.ring svg{transform:rotate(-90deg)}
.ring .n{font-size:34px;font-weight:800;line-height:1}
/* word */
.w{padding:13px 0;border-bottom:2px solid var(--line)}
.w:last-child{border:0;padding-bottom:0}
.wh{display:flex;gap:8px;align-items:center;cursor:pointer}
.ww{font-size:17px;font-weight:800;direction:ltr;flex:1}
.wm{color:var(--tx2);font-size:13.5px}
.cv{font-size:16px;color:var(--tx3);transition:.2s}
.cv.op{transform:rotate(180deg)}
.se{margin-top:8px;font-weight:700;font-size:14.5px}
.sa{color:var(--tx2);font-size:13px}
.more{margin-top:9px;padding-top:9px;border-top:2px dashed var(--line);font-size:13px;color:var(--tx2)}
.more div{margin-bottom:5px}
.more b{color:var(--tx)}
.tip{background:var(--red-l);border-radius:10px;padding:8px 11px;margin-top:8px;font-size:12.5px}
.tip .x{color:var(--red-t);text-decoration:line-through;direction:ltr;font-weight:700}
.tip .v{color:var(--green-t);direction:ltr;font-weight:700}
/* quiz */
.qbar{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.qbar>i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
.qc{text-align:center;padding:26px 16px;min-height:180px;display:flex;flex-direction:column;justify-content:center}
.qw{font-size:33px;font-weight:800;direction:ltr;margin-bottom:6px}
.qs{font-size:16px;direction:ltr;color:var(--tx2)}
.qa{font-size:22px;font-weight:800;color:var(--green-t);margin-top:14px}
.qam{font-size:14px;color:var(--tx2);margin-top:3px}
.fb{position:relative;margin:-14px -14px 0;padding:16px 14px 14px;border-radius:16px 16px 0 0}
.fb.ok{background:var(--green-l)}.fb.no{background:var(--red-l)}
.fb .t{font-weight:800;font-size:16px;margin-bottom:3px}
.fb.ok .t{color:var(--green-t)}.fb.no .t{color:var(--red-t)}
/* stats */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px}
.sc{background:var(--shade);border-radius:14px;padding:13px 9px;text-align:center}
.sc.c1{background:var(--purple-l)}.sc.c1 b{color:var(--purple-t)}
.sc.c2{background:var(--blue-l)}.sc.c2 b{color:var(--blue-t)}
.sc.c3{background:var(--indigo-l)}.sc.c3 b{color:var(--indigo-t)}
.sc b{display:block;font-size:23px;font-weight:800;line-height:1.2}
.sc span{font-size:11px;color:var(--tx2);font-weight:700}
/* misc */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800}
.bg-verbs{background:var(--purple-l);color:var(--purple-t)}
.bg-adj{background:var(--green-l);color:var(--green-t)}
.bg-nouns{background:var(--gold-l);color:var(--gold-t)}
.bg-general{background:var(--blue-l);color:var(--blue-t)}
.bg-phrases{background:#fce4ec;color:#c23f66}
@media(prefers-color-scheme:dark){.bg-phrases{background:#3a1826;color:#f0a8be}}
.due{background:var(--gold-l);color:var(--gold-t)}
.late{background:var(--red-l);color:var(--red-t)}
input,select{padding:11px 13px;border:2px solid var(--line);border-radius:12px;background:var(--card);
color:var(--tx);font-family:inherit;font-size:14.5px;width:100%;font-weight:600}
.hide{display:none}
.wr{margin-top:9px;padding:10px 11px;background:var(--shade);border-radius:12px}
.wr .lb{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.wr .lb span{font-size:12px;font-weight:700;color:var(--tx2)}
.wr .dots{display:flex;gap:4px}
.wr .dot{width:8px;height:8px;border-radius:50%;background:var(--line-d)}
.wr .dot.on{background:var(--green)}
.wr .row2{display:flex;gap:7px}
.wr input{flex:1;padding:9px 12px;font-size:14px;direction:ltr;text-align:left;border-radius:10px}
.wr input:focus{outline:none;border-color:var(--green)}
.wr .go{padding:9px 14px;border:0;background:var(--green);color:#fff;border-radius:10px;
font-weight:800;font-size:13px;cursor:pointer;flex-shrink:0}
.wr .go:active{transform:scale(.94)}
.wr .done{display:flex;align-items:center;gap:7px;color:var(--green-t);font-weight:800;font-size:13.5px}
.sp{background:transparent;border:0;cursor:pointer;padding:3px 6px;font-size:16px;
line-height:1;color:var(--blue);border-radius:8px;flex-shrink:0;transition:.12s;font-family:inherit}
.sp:active{transform:scale(.88)}
.sp:hover{background:var(--blue-l)}
.sp.on{animation:pulse .6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.sprow{display:flex;align-items:flex-start;gap:6px}
.sprow>.tx{flex:1;min-width:0}
.spbig{font-size:26px;padding:9px 14px;border:0;
border-radius:16px;background:var(--blue-l);color:var(--blue-t);box-shadow:var(--shadow-sm)}
.note{font-size:12px;color:var(--tx3);line-height:1.6;margin-top:10px}
/* dialogues */
.dlg{background:var(--blue-l);border-radius:14px;padding:13px 15px;margin:12px 0}
.dlg .lb{font-size:11.5px;font-weight:800;color:var(--blue-t);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.dln{display:flex;gap:8px;margin-bottom:7px;align-items:flex-start}
.dln:last-child{margin-bottom:0}
.dav{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
font-size:10px;font-weight:800;color:#fff;margin-top:1px}
.dav.a{background:var(--green)}.dav.b{background:var(--green)}
.dtx{flex:1;min-width:0}
.dtx .e{font-weight:700;font-size:13.5px;direction:ltr;text-align:left}
.dtx .a{font-size:12px;color:var(--tx2)}
/* diagnostic */
.diag{background:var(--card);border-radius:14px;padding:15px;margin-top:2px}
.diag .h{font-weight:800;font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.diag .box{background:var(--shade);border-radius:10px;padding:11px 13px;margin-bottom:8px}
.diag .box .l{font-size:11.5px;color:var(--tx2);margin-bottom:3px;font-weight:700}
.diag .box .w{font-weight:800;font-size:15px;direction:ltr}
.diag .vs{text-align:center;color:var(--tx3);font-size:12px;margin:6px 0;font-weight:800}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
justify-content:center;padding:20px;z-index:99}
.pop>div{background:var(--card);border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.pop>div{animation:pop .22s ease-out}
@keyframes sl{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
@keyframes slOut{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(8px)}}
#settings-box:not(.hide),#about-box:not(.hide){animation:sl .22s ease-out}
.view{animation:sl .18s ease-out}
#v-home>*{animation:sl .4s ease-out backwards}
#v-home>*:nth-child(1){animation-delay:.02s}
#v-home>*:nth-child(2){animation-delay:.06s}
#v-home>*:nth-child(3){animation-delay:.10s}
#v-home>*:nth-child(4){animation-delay:.14s}
#v-home>*:nth-child(5){animation-delay:.18s}
#v-home>*:nth-child(6){animation-delay:.22s}
#v-home>*:nth-child(7){animation-delay:.26s}
#v-home>*:nth-child(8){animation-delay:.30s}
#v-home>*:nth-child(n+9){animation-delay:.34s}
@keyframes flamepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.chip.st.pulse svg{animation:flamepulse 1.8s ease-in-out infinite;transform-origin:center}

/* Dashboard additions */
.dash-title{font-size:13px;color:var(--tx2);font-weight:800;margin:18px 2px 8px}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;color:var(--tx2);font-weight:800;font-size:14px;cursor:pointer;padding:6px 2px;font-family:inherit}
.backbtn svg{transform:scaleX(-1)}
.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick{border:1px solid var(--line-soft);background:var(--card);border-radius:16px;padding:15px 7px;text-align:center;cursor:pointer;font-family:inherit;color:var(--tx);font-weight:800;box-shadow:var(--shadow-sm);transition:transform .12s}
.quick:active{transform:scale(.97)}
.quick span{display:block;font-size:22px;margin-bottom:5px}.quick small{display:block;color:var(--tx2);font-size:11px;margin-top:3px}
.lesson-reminder{border:1px solid var(--line-soft);background:var(--shade);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.lesson-reminder b{display:block;margin-bottom:7px}.lesson-steps{direction:rtl;text-align:center;font-size:13px;font-weight:800;white-space:nowrap}
.more-row{display:flex;align-items:center;gap:12px;padding:15px;border-bottom:1px solid var(--line);cursor:pointer}.more-row:last-child{border-bottom:0}.more-row i{font-style:normal;font-size:21px}.more-row div{flex:1;font-weight:800}.more-row span{color:var(--tx3)}
.more-achievements-wrap{margin-bottom:12px}.more-achievements-label{display:flex;align-items:center;gap:7px;color:var(--tx2);font-size:13px;font-weight:900;margin:14px 2px 8px}.more-achievements-label .ic{font-size:19px;color:var(--gold-t)}
.more-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}.more-stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow-sm);min-width:0}.more-stat-head{display:flex;align-items:center;gap:8px;color:var(--tx2);font-size:12px;font-weight:800;margin-bottom:8px}.more-stat-head .ic{font-size:20px;color:var(--green-t)}.more-stat strong{display:block;font-size:21px;line-height:1.1}.more-stat small{display:block;color:var(--tx3);font-size:11px;margin-top:4px}
.quick-review-card{display:flex;align-items:center;gap:13px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow-sm)}.quick-review-card:active{transform:scale(.99)}.quick-review-icon{display:grid;place-items:center;color:var(--blue);font-size:24px;flex-shrink:0}.quick-review-copy{flex:1;min-width:0}.quick-review-copy b{display:block;font-size:15px}.quick-review-copy span{display:block;color:var(--tx2);font-size:12px;margin-top:3px}.quick-review-card>.ic{color:var(--tx3);font-size:20px}
.more-achievements{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.achievement-mini{background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:13px 8px;text-align:center;box-shadow:var(--shadow-sm)}.achievement-mini .ic{font-size:27px;color:var(--gold-t)}.achievement-mini.locked{opacity:.5;filter:grayscale(1)}.achievement-mini b{display:block;font-size:11px;margin-top:7px;line-height:1.35}.achievement-mini small{font-size:10px;color:var(--tx3)}
@media(max-width:360px){.more-stats{grid-template-columns:1fr 1fr}.more-achievements{grid-template-columns:1fr 1fr 1fr}.more-stat{padding:12px}.more-hero{padding:15px}}

.seg{display:flex;gap:6px;background:var(--shade);padding:4px;border-radius:14px}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;border-radius:10px;font-family:inherit;font-weight:800;font-size:12.5px;color:var(--tx2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,color .15s}
.seg button svg{font-size:17px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--shadow-sm)}
@media(max-width:420px){.quickgrid{grid-template-columns:1fr}.lesson-steps{font-size:11px}}

/* V2 learning experience */
.goal,.challenge,.ability,.mastery,.favbox{border:1px solid var(--line-soft);border-radius:20px;padding:17px;background:var(--card);margin-bottom:12px;box-shadow:var(--shadow-card)}
.goal{background:linear-gradient(135deg,var(--green-l),var(--card));border-color:var(--green)}
.goal h3,.challenge h3,.ability h3{margin:0 0 8px;font-size:16px}.goal ul{margin:8px 0;padding-right:20px}.goal li{margin:5px 0}
.phasebar{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:10px 0}.phase{font-size:11px;text-align:center;padding:7px 3px;border-radius:9px;background:var(--bg);color:var(--tx2);font-weight:800}.phase.on{background:var(--green-l);color:var(--green-t);border:1px solid var(--green)}
.fav{border:0;background:transparent;font-size:22px;padding:2px 6px;cursor:pointer;color:var(--tx3)}.fav.on{color:var(--gold-t)}
.production textarea,.scenario textarea{width:100%;min-height:80px;resize:vertical;margin:8px 0}.answerbox{padding:12px;border-radius:12px;background:var(--blue-l);margin-top:9px}.hiddenanswer{filter:blur(7px);user-select:none}.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modecard{padding:15px;border:1px solid var(--line-soft);border-radius:16px;background:var(--card);text-align:right;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .12s}.modecard:active{transform:scale(.97)}.modecard b{display:block;margin-bottom:4px}.ability-list{display:grid;gap:8px}.ability-item{display:flex;gap:8px;align-items:center;padding:10px;border-radius:11px;background:var(--bg)}
.quick-timer{font-size:28px;font-weight:900;text-align:center;color:var(--red-t);margin:8px}.situation{font-size:15px;background:var(--gold-l);padding:12px;border-radius:12px;margin:10px 0}.empty{text-align:center;padding:28px 14px;color:var(--tx2)}

/* Cloud account + League */

const DIALOGUES={"1": [[["I need some help with this file.", "أحتاج بعض المساعدة في هذا الملف."], ["Sure, what do you want me to do?", "أكيد، وش تبيني أسوي؟"], ["Can you give me the numbers? I don't have them.", "ممكن تعطيني الأرقام؟ ما هي عندي."], ["I'll get them for you now.", "بأجيبها لك الآن."]], [["Can I take this seat?", "ممكن آخذ هذا المقعد؟"], ["Sure. Are you going to make coffee?", "أكيد. رايح تسوي قهوة؟"], ["Yes, I'll use the machine. Let me try it first.", "إي، بأستخدم الماكينة. خلني أجربها أول."], ["Okay, just ask if you need help.", "تمام، بس اطلب إذا احتجت مساعدة."]]], "2": [[["Are you going to the meeting?", "رايح الاجتماع؟"], ["Yes, I'll come in five minutes.", "إي، بأجي بعد خمس دقايق."], ["Don't leave without your laptop.", "لا تمشي بدون لابتوبك."], ["I already put it in my bag.", "سبق وحطيته في شنطتي."], ["We might move to the small room.", "يمكن ننتقل للغرفة الصغيرة."]], [["Can you bring your charger tomorrow?", "ممكن تجيب شاحنك بكرة؟"], ["I'll send you a reminder tonight.", "برسل لك تذكير الليلة."], ["Please keep the door open.", "لو سمحت خلّ الباب مفتوح."], ["Sure. Turn left after the elevator, right?", "تمام. ألف يسار بعد المصعد، صح؟"], ["Yes. Stop at the second office.", "إي. وقف عند المكتب الثاني."]]], "3": [[["What do you think about the plan?", "وش رأيك بالخطة؟"], ["I don't know yet. Let me see the details.", "ما أدري لسه. خلني أشوف التفاصيل."], ["I understand your concern.", "أتفهم قلقك."], ["What do you mean exactly?", "وش تقصد بالضبط؟"]], [["I believe this will work.", "أعتقد إنها راح تنجح."], ["Do you remember the last attempt?", "تتذكر المحاولة الأخيرة؟"], ["I didn't forget. We decided to change it.", "ما نسيت. قررنا نغيرها."], ["Okay, I agree with the new plan.", "تمام، أوافق على الخطة الجديدة."]]], "4": [[["When do you start the report?", "متى تبدأ التقرير؟"], ["I'll finish it by five. Can I change the format?", "بأخلصه الساعة خمسة. ممكن أغير الشكل؟"], ["Sure, just check it with me before you work on it.", "تمام، بس تأكد معي قبل ما ت r new house?", "هذا بيتك الجديد؟"], ["Yes, I'm working from home today.", "إي، أشتغل من البيت اليوم."], ["Nice room. Close the door, please.", "غرفة حلوة. سكّر الباب لو سمحت."], ["Sure, this is a quiet place.", "تمام، هذا مكان هادئ."]], [["Which city do you live in?", "أي مدينة تسكن فيها؟"], ["Near the main street.", "قريب من الشارع الرئيسي."], ["Do you have a car?", "عندك سيارة؟"], ["Yes, parked on the ground floor. Let's put the keys on the table.", "إي، مركونة في الطابق الأرضي. خلّنا نحط المفاتيح على الطاولة."]]], "21": [[["I don't have much money right now.", "ما عندي فلوس كثير الحين."], ["What's the price?", "كم السعر؟"], ["The cost is high. Did you pay the bill?", "التكلفة عالية. دفعت الفاتورة؟"], ["Not from this account yet.", "لسه ما من هذا الحساب."]], [["I need to go to the bank.", "أحتاج أروح البنك."], ["Use your card instead.", "استخدم بطاقتك بدال."], ["It's not in the budget.", "مو ضمن الميزانية."], ["Check the market first — it's good value.", "شوف السوق أول — قيمتها كويسة."]]], "22": [[["How's your health?", "كيف صحتك؟"], ["I saw the doctor yesterday.", "شفت الدكتور أمس."], ["Any pain?", "فيه ألم؟"], ["A little. I'm taking medicine for my head.", "شوي. آخذ دواء لراسي."]], [["Can you give me a hand?", "ممكن تساعدني؟"], ["Sure, just let me finish this food.", "تمام، خلني أخلص هالأكل."], ["Drink some water first — you look tired, your eyes are red.", "اشرب شوي ماء أول — تبدو متعب، عيونك حمراء."], ["I will — I need more sleep too.", "بأسوي — أحتاج نوم أكثر بعد."]]], "23": [[["I need more information.", "أحتاج معلومات أكثر."], ["Check the data in the file.", "شوف البيانات في الملف."], ["Which system are we using?", "أي نظام نستخدم؟"], ["I'll send you the number.", "برسل لك الرقم."]], [["Can you explain in detail?", "ممكن تشرح بالتفصيل؟"], ["For example, this is the main point.", "مثلاً، هذي النقطة الرئيسية."], ["What's the best way to do it?", "وش أفضل طريقة نسويها؟"], ["This part is the tricky one.", "هذا الجزء هو الصعب."]]], "24": [[["How was your trip?", function ic(name,cls){
  const body=ICONP[name]||'';
  return `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ic ${cls||''}" style="display:inline-block;vertical-align:-0.16em;flex-shrink:0">${body}</svg>`;
}

/* ---- speech ---- */
const TTS={ok:'speechSynthesis' in window,voice:null,rate:.9,list:[]};
function pickVoice(){
  if(!TTS.ok)return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang));
  TTS.list=vs;
  if(!vs.length)return;
  if(S.voice){const m=vs.find(v=>v.name===S.voice);if(m){TTS.voice=m;return}}
  const pref=[/samantha/i,/daniel/i,/google (us|uk) english/i,/aria|guy|jenny/i,/en-US/i,/en-GB/i];
  for(const p of pref){const m=vs.find(v=>p.test(v.name)||p.test(v.lang));if(m){TTS.voice=m;return}}
  TTS.voice=vs[0];
}
if(TTS.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let SPK=null;
function say(txt,btn){
  if(!TTS.ok)return;
  speechSynthesis.cancel();
  if(SPK){SPK.classList.remove('on');if(SPK===btn){SPK=null;return}}
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=TTS.voice?TTS.voice.lang:'en-US';
  if(TTS.voice)u.voice=TTS.voice;
  u.rate=S.rate||TTS.rate;u.pitch=1;
  if(btn){btn.classList.add('on');SPK=btn;
    u.onend=u.onerror=()=>{btn.classList.remove('on');if(SPK===btn)SPK=null};}
  speechSynthesis.speak(u);
}
const SAY={};
let SID=0;
function spkBtn(txt,cls){
  if(!TTS.ok)return'';
  const id='s'+(++SID);SAY[id]=txt;
  return `<button class="sp ${cls||''}" onclick="event.stopPropagation();say(SAY['${id}'],this)" aria-label="استمع">${ic('speaker')}</button>`;
}
const today=()=>{const d=new Date();return Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/D0)};
const ALL={};G.forEach(g=>g.items.forEach(it=>ALL[g.id+'.'+it.n]={it,g}));

function card(k){return S.cards[k]||null}
function gState(gid){
  const g=G.find(x=>x.id===gid);
  const ks=g.items.map(i=>gid+'.'+i.n);
  const st=ks.filter(k=>card(k));
  const ms=ks.filter(k=>{const c=card(k);return c&&c.lv>=2});
  return{started:st.length>0,count:st.length,mastered:ms.length,total:ks.length,
    done:ms.length===ks.length,keys:ks};
}
function unlocked(gid){
  const g=G.find(x=>x.id===gid);
  if(g&&g.section==='phrases')return true;
  if(gid===1)return true;
  const p=gState(gid-1);
  return p.mastered>=Math.ceil(p.total*0.7);
}
function curGroup(){
  for(const g of G){const s=gState(g.id);if(!s.done&&unlocked(g.id))return g.id;}
  return 35;
}
function dueList(){
  const t=today(),out=[];
  Object.keys(S.cards).forEach(k=>{const c=S.cards[k];if(c.due<=t)out.push(k)});
  return out.sort((a,b)=>S.cards[a].due-S.cards[b].due);
}
function lateCount(){const t=today();return Object.keys(S.cards).filter(k=>S.cards[k].due<t).length}

function grade(k,score){
  // score: 0=لا أعرفها 1=أعرفها قليلاً 2=أتقنتها
  let c=S.cards[k];
  if(!c)c={lv:0,due:today(),seen:0,pts:0};
  c.seen++;c.pts=(c.pts||0)+score;
  let iv;
  if(score===2){c.lv=Math.min(c.lv+1,IV.length);S.xp+=4;
    iv=IV[Math.min(c.lv-1,IV.length-1)];}
  else if(score===1){S.xp+=2;
    const base=c.lv===0?1:IV[Math.min(c.lv-1,IV.length-1)];
    iv=Math.max(1,Math.round(base/2));}
  else{c.lv=Math.max(0,c.lv-2);S.xp+=1;iv=1;}
  c.due=today()+iv;
  S.cards[k]=c;
  bumpStreak();save();
}
function bumpStreak(){
  const t=today();
  if(S.last===t)return;
  const milestones=[3,7,14,30,50,100,200,365];
  if(S.last===t-1){
    S.streak++;
    if(milestones.includes(S.streak))setTimeout(()=>celebrate('streak',{days:S.streak}),300);
  }else S.streak=1;
  S.last=t;if(!S.started)S.started=t;
}
function accuracy(){
  let s=0,p=0;Object.values(S.cards).forEach(c=>{s+=c.seen;p+=(c.pts||0)});
  return s?Math.round(p/(s*2)*100):0;
}
function learned(){return Object.values(S.cards).filter(c=>c.lv>=3).length}

function confuseFor(k){
  const {it,g}=ALL[k];
  const c=CONFUSE[it.w.toLowerCase()];
  if(c){
    const otherW=c[0], note=c[1];
    let om=null;
    if(otherW){for(const kk in ALL){if(ALL[kk].it.w.toLowerCase()===otherW){om=ALL[kk].it;break}}}
    return {kind:'known',note,other:om};
  }
  const pool=g.items.filter(x=>x.n!==it.n);
  const picks=pool.sort(()=>Math.random()-.5).slice(0,2);
  return {kind:'fallback',picks};
}

function ring(pct,size,sw){
  const r=(size-sw)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}"
  fill="none" stroke="var(--line)" stroke-width="${sw}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--green)" stroke-width="${sw}"
  stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct/100)}"
  style="transition:stroke-dashoffset .7s"/></svg>`;
}

function wrHTML(k){
  const n=S.write[k]||0;
  if(n>=5)return `<div class="wr"><div class="done">${ic('check')} كتبتها 5 مرات</div></div>`;
  const dots=Array.from({length:5},(_,i)=>`<span class="dot ${i<n?'on':''}"></span>`).join('');
  return `<div class="wr" onclick="event.stopPropagation()">
  <div class="lb"><span>اكتب الجملة (${AR(n)}/5)</span><div class="dots">${dots}</div></div>
  <div class="row2"><input type="text" id="wi-${k.replace('.','_')}" placeholder="اكتب هنا..."
  onkeydown="if(event.key==='Enter'){event.preventDefault();wrGo('${k}')}">
  <button class="go" onclick="wrGo('${k}')">التالي</button></div></div>`;
}
function wrGo(k){
  const id='wi-'+k.replace('.','_');
  const el=document.getElementById(id);
  if(!el||!el.value.trim())return;
  S.write[k]=Math.min(5,(S.write[k]||0)+1);
  save();render();
}


function phraseSaved(k){return S.phrases.includes(k)}
function refreshFavoriteUI(k,isSaved){
  document.querySelectorAll('.fav[data-fav-key]').forEach(btn=>{
    if(btn.dataset.favKey!==k)return;
    btn.classList.toggle('on',isSaved);
    btn.innerHTML=isSaved?ic('star'):ic('starOutline');
    btn.setAttribute('aria-pressed',isSaved?'true':'false');
  });
  const fav=document.getElementById('h-xp');
  if(fav)countTo(fav,S.phrases.length);
}
function togglePhrase(k){
  const i=S.phrases.indexOf(k),wasSaved=i>=0;
  if(wasSaved)S.phrases.splice(i,1);else{S.phrases.push(k);S.xp+=1}
  const isSaved=!wasSaved;
  save();
  refreshFavoriteUI(k,isSaved);
  if(V==='phrases')vPhrases();
}
function favBtn(k){const on=phraseSaved(k);return `<button class="fav ${on?'on':''}" data-fav-key="${esc(k)}" aria-pressed="${on?'true':'false'}" onclick="event.stopPropagation();togglePhrase('${k}')" title="حفظ العبارة">${on?ic('star'):ic('starOutline')}</button>`}
function lessonGoal(g){
 const maps={verbs:'تصف ما تريد وتفعل وتفكر فيه',adj:'تصف الأشخاص والأشياء والمشاعر',nouns:'تتحدث عن العمل والحياة اليومية',general:'تربط أفكارك بصورة طبيعية',phrases:'تستخدم عبارات جاهزة في محادثات حقيقية'};

}

function productionHTML(g){

const SCENES={
  verbs:['في المكتب','تحتاج مساعدة في ملف وتريد أن تطلبها بأدب.'],adj:['وصف تجربة','صف اجتماعاً أو مشروعاً بثلاث صفات.'],nouns:['محادثة عمل','تحدث عن مشروع أو مشكلة أو قرار.'],general:['ربط الأفكار','قدّم رأياً مع سبب ونتيجة.'],phrases:['موقف يومي','استخدم عبارتين جاهزتين لبدء المحادثة أو إنهائها.']};
function scenarioHTML(g){

  return `<div class="w">
  <div class="wh" onclick="tw('${k}')">
    <span class="ww">${esc(it.w)}</span>
    ${spkBtn(it.w)}

  <div class="sa">${esc(it.ar)}</div></div>${spkBtn(it.en)}</div>
  ${open?`<div class="more">
    ${it.ex_en?`<div class="sprow"><div class="tx"><b>توسّع:</b> <span class="en" style="display:inline">${esc(it.ex_en)}</span> — ${esc(it.ex_ar)}</div>${spkBtn(it.ex_en)}</div>`:''}

  </div>`:''}

const PHRASE_EXTRA={};
function favExtraBtn(k){const sk='x:'+k,on=phraseSaved(sk);return `<button class="fav ${on?'on':''}" data-fav-key="${esc(sk)}" aria-pressed="${on?'true':'false'}" onclick="event.stopPropagation();togglePhrase('${sk}')">${on?ic('star'):ic('starOutline')}</button>`}
function dlgHTML(gid,idx){
  const d=(DIALOGUES[gid]||[])[idx];
  if(!d)return'';const g=G.find(x=>x.id===gid);
  const av=['a','b'];
  return `<div class="dlg"><div class="lb">${ic('pin')} المشهد: ${esc((SCENES[g.section]||["محادثة"])[0])} · ${ic('chat')} حوار سريع</div>
  ${d.map((ln,i)=>{const pk='d'+gid+'-'+idx+'-'+i;PHRASE_EXTRA[pk]={en:ln[0],ar:ln[1],m:'من الحوار'};return `<div class="dln"><div class="dav ${av[i%2]}">${i%2===0?'A':'B'}</div>
  <div class="dtx"><div class="e">${esc(ln[0])} ${spkBtn(ln[0])} ${favExtraBtn(pk)}</div><div class="a">${esc(ln[1])}</div></div></div>`}).join('')}
  </div>`;
}
function groupBodyHTML(g){
  let h='';
  g.items.forEach((i,idx)=>{
    h+=wordHTML(g.id+'.'+i.n,OPEN===g.id+'.'+i.n);
    if(idx===4)h+=dlgHTML(g.id,0);
    if(idx===9)h+=dlgHTML(g.id,1);
  });
  return h;
}

function tw(k){OPEN=(OPEN===k)?null:k;OPENSET=true;render()}

function greetingHTML(){
  const h=new Date().getHours();
  const time=h<5?'طاب مساؤك':h<12?'صباح الخير':h<17?'طاب يومك':h<21?'مساء الخير':'طاب مساؤك';
  const due=dueList().length, started=Object.keys(S.cards).length, streak=S.streak||0;
  const pool=[
    'كل كلمة تتعلمها اليوم تقربك خطوة.',
    'الاستمرار أهم من السرعة.',
    'خمس دقائق اليوم أفضل من صفر.',
    'راجع القليل، لكن راجعه دائماً.',
    'التقدم الصغير المتكرر يصنع فرقاً كبيراً.',
  ];
  let msg;
  if(due>=10) msg=`عندك ${AR(due)} كلمة تنتظر المراجعة`;

}

let Q=[],QI=0,QSt='q',QR={g:0,y:0,r:0},QMode='',QLast=null;
function startQ(mode){
  SPECIAL='';clearInterval(STIMER);QMode=mode;
  if(mode==='due'){Q=dueList().slice(0,20);if(!Q.length)Q=Object.keys(S.cards).slice(0,20);if(!Q.length)Q=Object.keys(ALL).slice(0,20);}
  else{const g=G.find(x=>x.id===mode);Q=g.items.map(i=>mode+'.'+i.n);}
  if(!Q.length){show('home');return}
  Q=Q.sort(()=>Math.random()-.5);QI=0;QSt='q';QR={g:0,y:0,r:0};
  show('quiz');
}

function startRecall(){let pool=Object.keys(S.cards);if(!pool.length)pool=Object.keys(ALL).slice(0,20);Q=pool.sort(()=>Math.random()-.5).slice(0,15);QI=0;SPECIAL='recall';QSt='q';show('quiz')}
function startQuick(){let pool=Object.keys(S.cards);if(pool.length<10)pool=Object.keys(ALL).slice(0,35);Q=pool.sort(()=>Math.random()-.5).slice(0,18);QI=0;SPECIAL='quick';QSt='q';SECONDS=60;show('quiz');clearInterval(STIMER);STIMER=setInterval(()=>{SECONDS--;const e=document.getElementById('timer');if(e)e.textContent=AR(SECONDS);if(SECONDS<=0){clearInterval(STIMER);SPECIAL='';Q=[];vQuiz()}},1000)}

 }

 }

function setTitle(t){const e=document.getElementById('pagetitle');if(e)e.textContent=t}
function countTo(el,target){
  if(!el)return;
  const cur=parseInt(el.textContent)||0;
  if(cur===target){el.textContent=AR(target);return}
  const t0=performance.now(),dur=500;
  function step(t){
    const p=Math.min(1,(t-t0)/dur),eased=1-Math.pow(1-p,3);
    el.textContent=AR(Math.round(cur+(target-cur)*eased));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function animateCounts(root){
  (root||document).querySelectorAll('[data-count]').forEach(el=>{
    const target=+el.dataset.count,t0=performance.now(),dur=600;
    function step(t){
      const p=Math.min(1,(t-t0)/dur),eased=1-Math.pow(1-p,3);
      el.textContent=AR(Math.round(target*eased));
      if(p<1)requestAnimationFrame(step);else el.textContent=AR(target);
    }
    requestAnimationFrame(step);
  });
}

        result=await client.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname,data:{display_name:name||email.split('@')[0]}}});
        if(result.error)throw result.error;
        authMessage(result.data.session?'تم إنشاء الحساب.':'تم إنشاء الحساب. افتح رسالة التأكيد في بريدك ثم سجّل الدخول.','success');
      }else if(mode==='magic'){
        result=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
        if(result.error)throw result.error;
        authMessage('أرسلنا رابط الدخول إلى بريدك.','success');
      }else{
        if(!password)throw new Error('أدخل كلمة المرور.');
        result=await client.auth.signInWithPassword({email,password});
        if(result.error)throw result.error;
      }
    }catch(err){authMessage(err.message||'تعذر تسجيل الدخول.','error')}
    finally{btn.disabled=false}
  }
  async function loadRemoteState(){
    if(!user)return;
    setSync('جارٍ المزامنة','syncing');
    const {data,error}=await client.from('user_progress').select('app_state,updated_at').eq('user_id',user.id).maybeSingle();
    if(error){setSync('تعذر التحميل','error');return}
    const local=window.English350App?.getState?.()||{};
    const remote=data?.app_state||{};
    const hasRemote=remote&&Object.keys(remote).length>0;
    const hasLocal=local&&(local.xp>0||Object.keys(local.cards||{}).length>0||local.phrases?.length);
    applyingRemote=true;
    if(hasRemote){window.English350App?.replaceState?.(remote)}
    else if(hasLocal){await saveNow(local)}
    applyingRemote=false;
    setSync('','');
  }
  function summary(state){
    const cards=Object.values(state.cards||{});
    let total=0,correct=0,learned=0;
    cards.forEach(c=>{total+=Number(c?.n||c?.attempts||0);correct+=Number(c?.c||c?.correct||0);if((c?.lv||c?.level||0)>=2)learned++});
    return {completed_items:Object.keys(state.cards||{}).length,learned_items:learned,total_attempts:total,correct_attempts:correct,current_streak:Number(state.streak||0),last_activity_at:new Date().toISOString()};
  }
  async function saveNow(state){
    if(!client||!user||applyingRemote)return;
    setSync(navigator.onLine?'جارٍ الحفظ':'بانتظار الاتصال',navigator.onLine?'syncing':'offline');
    if(!navigator.onLine)return;
    const row={user_id:user.id,app_state:state,...summary(state)};
    const {error}=await client.from('user_progress').upsert(row,{onConflict:'user_id'});
    if(error){console.error(error);setSync('لم يتم الحفظ','error')}else setSync('','');
  }
  function scheduleSave(state){
    if(!ready||!user||applyingRemote)return;
    clearTimeout(saveTimer);saveTimer=setTimeout(()=>saveNow(state),650);
  }
  async function logout(){await client.auth.signOut();}
  function accountHTML(){
    if(!user)return '';
    return `<div class="account-mini"><div class="account-avatar">${esc((user.user_metadata?.display_name||user.email||'U').trim()[0]?.toUpperCase())}</div><div class="account-copy"><b>${esc(user.user_metadata?.display_name||'حسابي')}</b><span>${esc(user.email||'')}</span></div><button class="b gh account-logout" onclick="English350Cloud.logout()">خروج</button></div>`;
  }
  let leagueChannel=null,leagueRenderTimer=null;
  function leagueModal({title,body,confirmText='متابعة',onConfirm}){
    document.getElementById('cloud-modal')?.remove();
    const wrap=document.createElement('div');wrap.id='cloud-modal';wrap.className='cloud-modal';
    wrap.innerHTML=`<div class="cloud-modal-card"><h2>${esc(title)}</h2>${body}<div id="cloud-modal-message" class="auth-message"></div><div class="cloud-modal-actions"><button class="b gh" type="button" data-close>إلغاء</button><button class="b g" type="button" data-confirm>${esc(confirmText)}</button></div></div>`;
    document.body.appendChild(wrap);
    const close=()=>wrap.remove();wrap.querySelector('[data-close]').onclick=close;
    wrap.onclick=e=>{if(e.target===wrap)close()};
    wrap.querySelector('[data-confirm]').onclick=async()=>{
      const btn=wrap.querySelector('[data-confirm]'),msg=wrap.querySelector('#cloud-modal-message');btn.disabled=true;msg.textContent='جارٍ المتابعة...';
      try{await onConfirm(wrap);close()}catch(err){msg.textContent=err.message||'تعذر إكمال العملية.';msg.className='auth-message error';btn.disabled=false}
    };
    setTimeout(()=>wrap.querySelector('input')?.focus(),30);
  }
  async function createTeam(){
    if(!user)return;
    leagueModal({title:'إنشاء دوري',confirmText:'إنشاء الدوري',body:'<div class="sub" style="margin-bottom:10px">اختر اسمًا يظهر لجميع الأعضاء.</div><input id="league-name" maxlength="50" placeholder="مثال: أبطال English 350" value="دوري English 350">',onConfirm:async modal=>{
      const name=modal.querySelector('#league-name').value.trim();if(!name)throw new Error('اكتب اسم الدوري.');
      const {error}=await client.from('teams').insert({name,owner_id:user.id});if(error)throw error;
      await renderTeamPanel();
    }});
  }
  async function joinTeam(){
    if(!user)return;
    leagueModal({title:'الانضمام إلى دوري',confirmText:'انضمام',body:'<div class="sub" style="margin-bottom:10px">أدخل رمز الدعوة المكوّن من أحرف وأرقام.</div><input id="league-code-input" maxlength="12" inputmode="text" dir="ltr" style="text-transform:uppercase;text-align:center;letter-spacing:3px" placeholder="AB12CD">',onConfirm:async modal=>{
      const code=modal.querySelector('#league-code-input').value.trim().toUpperCase();if(!code)throw new Error('أدخل رمز الدوري.');
      const {error}=await client.rpc('join_team_by_code',{p_code:code});if(error)throw error;
      await renderTeamPanel();
    }});
  }
  async function copyLeagueCode(code){
    try{await navigator.clipboard.writeText(code);alert('تم نسخ رمز الدعوة.')}catch(_){prompt('انسخ رمز الدعوة',code)}
  }
  async function shareLeague(name,code){
    const text=`انضم إلى دوري ${name} في English 350\nرمز الدعوة: ${code}`;
    if(navigator.share){try{await navigator.share({title:`دوري ${name}`,text});return}catch(e){if(e.name==='AbortError')return}}
    await copyLeagueCode(code);
  }
  function roleLabel(role){return role==='owner'?'المالك':role==='admin'?'مدير':'عضو'}
  function scheduleLeagueRender(){clearTimeout(leagueRenderTimer);leagueRenderTimer=setTimeout(()=>{const panel=$('team-panel');if(panel&&!panel.closest('.view')?.classList.contains('hide'))renderTeamPanel()},900)}
  function subscribeLeague(teamId){
    if(leagueChannel){client.removeChannel(leagueChannel);leagueChannel=null}
    leagueChannel=client.channel(`league-${teamId}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'team_members',filter:`team_id=eq.${teamId}`},scheduleLeagueRender)
      .on('postgres_changes',{event:'*',schema:'public',table:'user_progress'},scheduleLeagueRender)
      .subscribe();
  }
  async function renderTeamPanel(){
    const el=$('team-panel');if(!el||!user)return;
    el.innerHTML='<div class="c league-status">جارٍ تحميل الدوري...</div>';
    const {data:memberships,error}=await client.from('team_members').select('team_id,role').eq('user_id',user.id).limit(1);
    if(error){el.innerHTML=`<div class="c league-status">تعذر تحميل الدوري.<div class="sub">${esc(error.message)}</div></div>`;return}
    if(!memberships?.length){
      if(leagueChannel){client.removeChannel(leagueChannel);leagueChannel=null}
      el.innerHTML='<div class="c league-empty"><div class="big">🏆</div><h2>ابدأ المنافسة</h2><div class="sub">أنشئ دوريًا خاصًا أو انضم إلى زملائك برمز الدعوة.</div><div class="league-actions"><button class="b g" onclick="English350Cloud.createTeam()">إنشاء دوري</button><button class="b gh" onclick="English350Cloud.joinTeam()">الانضمام برمز</button></div></div>';return;
    }
    const m=memberships[0];
    const {data:team,error:teamError}=await client.from('teams').select('id,name,join_code').eq('id',m.team_id).single();
    if(teamError){el.innerHTML='<div class="c league-status">تعذر قراءة بيانات الدوري.</div>';return}
    const {data:rows,error:rowsError}=await client.from('team_members').select('user_id,role,joined_at').eq('team_id',m.team_id);
    if(rowsError){el.innerHTML='<div class="c league-status">تعذر تحميل أعضاء الدوري.</div>';return}
    const ids=(rows||[]).map(x=>x.user_id);
    let profiles=[],progress=[];
    if(ids.length){
      const result=await Promise.all([
        client.from('profiles').select('id,display_name').in('id',ids),
        client.from('user_progress').select('user_id,app_state,completed_items,learned_items,total_attempts,correct_attempts,current_streak,last_activity_at').in('user_id',ids)
      ]);
      if(result[0].error||result[1].error){el.innerHTML='<div class="c league-status">لا تملك صلاحية مشاهدة ترتيب الدوري. راجع سياسات RLS.</div>';return}
      profiles=result[0].data||[];progress=result[1].data||[];
    }
    const pm=Object.fromEntries(profiles.map(x=>[x.id,x])),gm=Object.fromEntries(progress.map(x=>[x.user_id,x]));
    const ranked=(rows||[]).map(r=>{
      const p=pm[r.user_id]||{},g=gm[r.user_id]||{},state=g.app_state||{};
      const xp=Number(state.xp||0),streak=Number(g.current_streak||state.streak||0),learned=Number(g.learned_items||0),completed=Number(g.completed_items||0);
      const production=Object.keys(state.production||{}).length,scenarios=Object.keys(state.scenarios||{}).length;
      const score=xp+(streak*10)+(learned*5)+(production*2)+(scenarios*10);
      const accuracy=g.total_attempts?Math.round(Number(g.correct_attempts||0)/Number(g.total_attempts)*100):0;
      return {...r,name:p.display_name||'مستخدم',xp,streak,learned,completed,score,accuracy};
    }).sort((a,b)=>b.score-a.score||b.xp-a.xp||a.joined_at?.localeCompare?.(b.joined_at||'')||0);
    const myRank=ranked.findIndex(x=>x.user_id===user.id)+1;
    const list=ranked.map((r,i)=>`<div class="league-user ${r.user_id===user.id?'me':''}"><div class="league-rank">${i<3?['🥇','🥈','🥉'][i]:i+1}</div><div class="league-person"><b>${esc(r.name)}${r.user_id===user.id?' · أنت':''}</b><small>${roleLabel(r.role)}</small><div class="league-meta"><span>⚡ ${r.xp} XP</span><span>🔥 ${r.streak}</span><span>📚 ${r.learned}/350</span><span>✓ ${r.accuracy}%</span></div></div><div class="league-score"><b>${r.score}</b><small>نقطة دوري</small></div></div>`).join('');
    el.innerHTML=`<div class="c league-hero"><div class="league-title"><div class="league-icon">🏆</div><div><div class="sub">الدوري الحالي</div><h2 style="margin:2px 0">${esc(team.name||'دوري English 350')}</h2><div class="sub">مركزك الآن: ${myRank?`#${myRank}`:'—'} من ${ranked.length}</div></div></div><div class="league-code-box"><div><div class="sub">رمز الدعوة</div><strong class="league-code">${esc(team.join_code||'—')}</strong></div><button class="b gh" onclick="English350Cloud.copyLeagueCode('${esc(team.join_code||'')}')">نسخ</button></div><div class="league-actions"><button class="b g" onclick="English350Cloud.shareLeague('${esc(team.name||'الدوري')}','${esc(team.join_code||'')}')">مشاركة الدعوة</button><button class="b gh" onclick="English350Cloud.renderTeamPanel()">تحديث</button></div></div><div class="c"><h2 style="margin-bottom:4px">لوحة الترتيب</h2><div class="sub" style="margin-bottom:12px">الترتيب يجمع XP والاستمرارية والتقدم الحقيقي.</div><div class="league-list">${list||'<div class="league-status">لا يوجد أعضاء بعد.</div>'}</div></div>`;
    subscribeLeague(m.team_id);
  }
  function goHomeImmediately(){
    const app=window.English350App;
    if(typeof app?.showHome==='function'){
      app.showHome();
      return;
    }
    document.querySelector('.nv[data-v="home"]')?.click();
  }
  async function applySession(session,{force=false,navigateHome=false}={}){
    const nextUser=session?.user||null;
    const sameUser=Boolean(user&&nextUser&&user.id===nextUser.id);
    user=nextUser;

    // انقل الواجهة للرئيسية قبل إخفاء شاشة الدخول، حتى لا تظهر صفحة المزيد ولو للحظة.
    if(user&&(navigateHome||!sessionApplied)){
      goHomeImmediately();
    }
    showAuth(!user);

    if(user){
      ready=true;
      // وجّه للرئيسية فورًا قبل انتظار تحميل بيانات السحابة،
      // حتى لا تظهر صفحة «المزيد» لثوانٍ ثم تنتقل للرئيسية.
      if(navigateHome){
        goHomeImmediately();
      }
      // لا نعيد تحميل التقدم أو إعادة رسم التطبيق عند تجدد التوكن
      // أو عند الرجوع للتبويب؛ المزامنة الكاملة تحدث مرة واحدة فقط لكل جلسة.
      if(force||!sessionApplied||!sameUser){
        sessionApplied=true;
        await loadRemoteState();
      }
      if(!navigateHome){
        window.English350App?.render?.();
      }
      if(location.hash||new URLSearchParams(location.search).has('code')){
        history.replaceState({},document.title,location.pathname);
      }
    }else{
      sessionApplied=false;
      ready=false;
      setSync('غير متصل','');
    }
  }
  async function init(){
    if(!client){authMessage('تعذر تهيئة الاتصال.','error');showAuth(true);return}
    $('auth-form')?.addEventListener('submit',submitAuth);
    document.querySelectorAll('[data-auth-mode]').forEach(b=>b.onclick=()=>setAuthMode(b.dataset.authMode));

    client.auth.onAuthStateChange((event,session)=>{
      setTimeout(()=>{
        if(event==='TOKEN_REFRESHED'){
          // تحديث بيانات الجلسة فقط بدون ريفريش الواجهة أو رسالة مزامنة.
          user=session?.user||user;
          return;
        }
        if(event==='USER_UPDATED'){
          user=session?.user||user;
          return;
        }
        if(event==='SIGNED_OUT'){
          applySession(null);
          return;
        }
        if(event==='SIGNED_IN'||event==='PASSWORD_RECOVERY'){
          applySession(session,{force:!sessionApplied,navigateHome:true});
        }
      },0);
    });

    const {data,error}=await client.auth.getSession();
    if(error)authMessage(error.message||'تعذر استعادة جلسة الدخول.','error');
    await applySession(data?.session||null,{force:true,navigateHome:Boolean(data?.session)});

    window.addEventListener('online',()=>{setSync('جارٍ الاستئناف','syncing');scheduleSave(window.English350App?.getState?.())});
  }
  window.English350Cloud={init,scheduleSave,saveNow,logout,accountHTML,renderTeamPanel,createTeam,joinTeam,copyLeagueCode,shareLeague,getUser:()=>user};
  document.addEventListener('DOMContentLoaded',init);
})();

</script>
</body></html>
